<body>
    <div id="game-container">
        <div id="game-ui">
            <div id="game-header">
                <h1>Cat and Mouse</h1>
                <div id="game-status">Waiting for players...</div>
            </div>
            <div id="player-list"></div>
        </div>
        <div id="game-canvas"></div>
        <div id="role-message"></div>
        <div id="instructions">
            <div id="cat-instructions" class="hidden">
                <h2>You are the CAT</h2>
                <p>Hunt down all mice! Use WASD to move.</p>
            </div>
            <div id="mouse-instructions" class="hidden">
                <h2>You are a MOUSE</h2>
                <p>Survive and collect cheese! Use WASD to move.</p>
            </div>
        </div>
    </div>
